# One-command startup for the whole app: frontend, backend, the app's own
# Postgres. Code execution (Compiler tab, coding interviews) runs in the browser, so there is no
# execution service to host.
#
#   cp .env.example .env   # fill in real secrets — see that file
#   docker compose up --build
#
# Frontend: http://localhost:5173
# Backend:  http://localhost:8000  (docs at /docs)
#
# All secrets come from a single gitignored .env file (see .env.example) —
# never hardcode real secrets in this file, since it's committed to git.
# Every service that needs a given secret reads the exact same ${VAR}, so
# there's one source of truth and no risk of two services silently ending
# up with different values for what's supposed to be the same secret.

services:
  # ── Strop app ──────────────────────────────────────────────
  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: interviewiq
      POSTGRES_USER: interviewiq_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - app-network
    restart: always

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://interviewiq_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/interviewiq
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ2_API_KEY: ${GROQ2_API_KEY:-}
      WATCHFILES_FORCE_POLLING: "true"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]
    ports:
      - "8000:8000"
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  app-db-data:
