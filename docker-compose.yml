# One-command startup for the whole app: frontend, backend, the app's own
# Postgres, and a self-hosted Judge0 (for the Compiler tab's code execution).
#
#   cp .env.example .env   # fill in real secrets — see that file
#   docker compose up --build
#
# Frontend: http://localhost:5173
# Backend:  http://localhost:8000  (docs at /docs)
#
# All secrets come from a single gitignored .env file (see .env.example) —
# never hardcode real secrets in this file, since it's committed to git.
# Every service that needs a given secret reads the exact same ${VAR}, so
# there's one source of truth and no risk of two services silently ending
# up with different values for what's supposed to be the same secret.

services:
  # ── Strop app ──────────────────────────────────────────────
  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: interviewiq
      POSTGRES_USER: interviewiq_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - app-network
    restart: always

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - judge0-server
    environment:
      DATABASE_URL: postgresql+asyncpg://interviewiq_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/interviewiq
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      JUDGE0_URL: http://judge0-server:2358
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?set JUDGE0_AUTH_TOKEN in .env}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ2_API_KEY: ${GROQ2_API_KEY:-}
      WATCHFILES_FORCE_POLLING: "true"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]
    ports:
      - "8000:8000"
    networks:
      - app-network
      - judge0-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app-network
    restart: always

  # ── Self-hosted Judge0 (code execution for the Compiler tab) ────
  # See infra/judge0/README.md for why this exists (Judge0's stock image
  # doesn't work on Docker Desktop's WSL2 backend without a rebuilt isolate
  # and a couple of cgroup v2 fixes).
  judge0-db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?set JUDGE0_DB_PASSWORD in .env}
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    networks:
      - judge0-network
    restart: always

  judge0-redis:
    image: redis:7.2.4
    command:
      ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD in .env}
    networks:
      - judge0-network
    restart: always

  judge0-server:
    build: ./infra/judge0
    privileged: false
    # Submissions are untrusted code: cap what a runaway one can take from the host.
    mem_limit: 2g
    pids_limit: 512
    cpus: 2.0
    # Submissions are executed here too, so it needs the same sandbox permissions as the workers.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./infra/judge0/entrypoint-cgroup-fix.sh:/usr/local/bin/entrypoint-cgroup-fix.sh:ro
    depends_on:
      - judge0-db
      - judge0-redis
    environment: &judge0-env
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?set JUDGE0_REDIS_PASSWORD in .env}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?set JUDGE0_DB_PASSWORD in .env}
      AUTHN_HEADER: X-Auth-Token
      AUTHN_TOKEN: ${JUDGE0_AUTH_TOKEN:?set JUDGE0_AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:2358:2358"
    networks:
      - judge0-network
    restart: always

  judge0-workers:
    build: ./infra/judge0
    command: ["./scripts/workers"]
    privileged: false
    # Submissions are untrusted code: cap what a runaway one can take from the host.
    mem_limit: 2g
    pids_limit: 512
    cpus: 2.0
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./infra/judge0/entrypoint-cgroup-fix.sh:/usr/local/bin/entrypoint-cgroup-fix.sh:ro
    depends_on:
      - judge0-db
      - judge0-redis
    environment: *judge0-env
    networks:
      - judge0-network
    restart: always

networks:
  app-network:
    driver: bridge
  judge0-network:
    driver: bridge

volumes:
  app-db-data:
  judge0-db-data:
